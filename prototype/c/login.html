<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 云枢智学</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <aside class="auth-side">
      <div>
        <div class="brand" style="color:#fff"><span class="brand-mark">云</span><span>云枢智学</span></div>
        <h2>学习路线 · 刷题自测<br>· AI 面试，一个闭环</h2>
        <p>把"看视频"这种弱效果行为，变成可量化、可追踪的技能掌握度。</p>
        <div class="auth-points">
          <div class="auth-point"><span class="n">1</span><div>按阶段学课，进度自动沉淀</div></div>
          <div class="auth-point"><span class="n">2</span><div>逐题练习，即时判分与解析</div></div>
          <div class="auth-point"><span class="n">3</span><div>AI 面试出维度报告，看得见进步</div></div>
        </div>
      </div>
      <div class="small" style="color:rgba(255,255,255,.42)">原型演示 · 数据仅保存在本地浏览器</div>
    </aside>

    <main class="auth-main">
      <h1>欢迎回来</h1>
      <p class="sub">登录后继续你的学习路线</p>

      <div class="auth-tabs" id="tabs">
        <button data-tab="code" class="active">验证码登录</button>
        <button data-tab="pwd">密码登录</button>
        <button data-tab="reg">注册</button>
      </div>

      <form id="authForm" autocomplete="off">
        <div class="field">
          <label>手机号</label>
          <input class="input" id="phone" maxlength="11" inputmode="numeric" placeholder="请输入手机号" value="13800138000">
        </div>
        <div class="field" id="codeRow">
          <label>验证码</label>
          <div class="input-group">
            <input class="input" id="code" maxlength="6" inputmode="numeric" placeholder="演示验证码 123456">
            <button type="button" class="btn btn-ghost" id="sendCode" style="white-space:nowrap">获取验证码</button>
          </div>
        </div>
        <div class="field hide" id="pwdRow">
          <label>密码</label>
          <input class="input" id="pwd" type="password" placeholder="请输入密码（演示可随意填写 6 位以上）">
        </div>
        <div class="field hide" id="nameRow">
          <label>昵称</label>
          <input class="input" id="nick" maxlength="12" placeholder="给自己起个昵称">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn">登录</button>
      </form>

      <div class="auth-hint">
        演示账号：<b>13800138000</b>，验证码 <b>123456</b>。<br>
        想看看"新学员"的首页？<a href="#" id="freshLink" style="color:var(--brand);font-weight:600">以未选路线的身份进入</a>
      </div>
    </main>
  </div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/c-shared.js"></script>
<script>
(function () {
  var tab = 'code';
  var tabs = document.getElementById('tabs');
  var codeRow = document.getElementById('codeRow');
  var pwdRow = document.getElementById('pwdRow');
  var nameRow = document.getElementById('nameRow');
  var submitBtn = document.getElementById('submitBtn');

  function setTab(t) {
    tab = t;
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === t);
    });
    codeRow.classList.toggle('hide', t === 'pwd');
    pwdRow.classList.toggle('hide', t !== 'pwd' && t !== 'reg');
    nameRow.classList.toggle('hide', t !== 'reg');
    submitBtn.textContent = t === 'reg' ? '注册并登录' : '登录';
  }
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) setTab(b.getAttribute('data-tab'));
  });

  var sending = false;
  document.getElementById('sendCode').addEventListener('click', function () {
    if (sending) return;
    var phone = document.getElementById('phone').value.trim();
    if (!/^1\d{10}$/.test(phone)) { UI.toast('请先输入正确的手机号', 'err'); return; }
    sending = true;
    var btn = this;
    var left = 60;
    btn.textContent = left + 's 后重发';
    btn.classList.add('disabled');
    var t = setInterval(function () {
      left--;
      btn.textContent = left + 's 后重发';
      if (left <= 0) {
        clearInterval(t);
        sending = false;
        btn.textContent = '获取验证码';
        btn.classList.remove('disabled');
      }
    }, 1000);
    UI.toast('验证码已发送（演示验证码 123456）', 'info');
  });

  document.getElementById('authForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var phone = document.getElementById('phone').value.trim();
    if (!/^1\d{10}$/.test(phone)) { UI.toast('请输入 11 位手机号', 'err'); return; }

    if (tab === 'code' || tab === 'reg') {
      var code = document.getElementById('code').value.trim();
      if (code !== '123456') { UI.toast('验证码不正确，演示验证码为 123456', 'err'); return; }
    }
    if (tab === 'pwd' || tab === 'reg') {
      var pwd = document.getElementById('pwd').value;
      if (pwd.length < 6) { UI.toast('密码至少 6 位', 'err'); return; }
    }

    DATA.seedUserState();
    var user = Store.get('user', null);

    if (tab === 'reg') {
      var nick = document.getElementById('nick').value.trim() || ('学员' + phone.slice(-4));
      user = {
        phone: phone, nickname: nick, avatar: '',
        mainRoute: null, joinedAt: C.todayStr(), status: 'normal'
      };
      UI.toast('注册成功，先选一条学习路线吧');
    } else {
      if (!user || user.phone !== phone) {
        user = { phone: phone, nickname: '学员' + phone.slice(-4), avatar: '', mainRoute: null, joinedAt: C.todayStr(), status: 'normal' };
      }
      UI.toast('登录成功');
    }
    Store.set('user', user);
    setTimeout(function () { location.href = 'home.html'; }, 350);
  });

  document.getElementById('freshLink').addEventListener('click', function (e) {
    e.preventDefault();
    DATA.seedUserState();
    var u = Store.get('user', null) || {};
    u.mainRoute = null;
    u.nickname = u.nickname || '新学员';
    Store.set('user', u);
    UI.toast('已切换为未选路线的身份', 'info');
    setTimeout(function () { location.href = 'home.html'; }, 350);
  });
})();
</script>
</body>
</html>
