spring:
  application:
    name: yunshu-zhixue
  profiles:
    default: dev
  # 认证完全由 JWT 过滤器链承担，不需要 Boot 生成的默认用户与随机密码
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # 本地开发时从仓库根目录 .env 读取变量；文件不存在时静默跳过，不影响生产部署
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  jackson:
    time-zone: UTC
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # 容器上限略高于业务上限（导入 5MB / 图片音频 2MB），
      # 让业务层的格式/大小校验给出精确错误码，而不是统一 10005
      max-file-size: 6MB
      max-request-size: 8MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

app:
  security:
    # C/B 双端使用不同密钥与 audience；生产必须通过环境变量覆盖
    c:
      secret: ${JWT_C_SECRET:dev-only-c-secret-change-me-0123456789abcdef}
      access-ttl: 30m
    admin:
      secret: ${JWT_ADMIN_SECRET:dev-only-admin-secret-change-me-0123456789abcdef}
      access-ttl: 30m
    refresh-ttl: 7d
    # 手机号加密与盲索引密钥（02-Q18）；Base64 解码后必须为 32 字节；生产必须环境变量注入
    phone-aes-key: ${PHONE_AES_KEY:ZGV2LW9ubHktcGhvbmUtYWVzLWtleS0zMi1ieXRlc3M=}
    phone-hmac-key: ${PHONE_HMAC_KEY:ZGV2LW9ubHktcGhvbmUtaG1hYy1rZXktMzItYnl0ZXM=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  features:
    ai-enabled: ${FEATURE_AI_ENABLED:true}
    tts-enabled: ${FEATURE_TTS_ENABLED:false}
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 200

interview:
  quota:
    # 每学员每上海自然日的 AI 面试次数；改为环境变量即可调整，无需发版
    daily-limit: ${INTERVIEW_DAILY_LIMIT:3}

integration:
  ai:
    # mock | aliyun；生产只允许 aliyun（适配器在业务开发阶段接入）
    provider: ${AI_PROVIDER:mock}
    connect-timeout: 2s
    request-timeout: 10s
  sms:
    # mock | aliyun；生产只允许 aliyun
    provider: ${SMS_PROVIDER:mock}

storage:
  # local | s3 | oss；dev=s3（MinIO），prod=oss（阿里云）；local 仅用于单元测试
  type: ${STORAGE_TYPE:s3}
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${STORAGE_S3_ACCESS_KEY:${MINIO_ROOT_USER:yunshu_minio}}
    secret-key: ${STORAGE_S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:change-me-minio}}
    bucket: ${STORAGE_S3_BUCKET:${MINIO_BUCKET:yunshu}}
    region: ${STORAGE_S3_REGION:us-east-1}
    path-style: ${STORAGE_S3_PATH_STYLE:true}
  oss:
    endpoint: ${STORAGE_OSS_ENDPOINT:}
    public-endpoint: ${STORAGE_OSS_PUBLIC_ENDPOINT:}
    access-key: ${STORAGE_OSS_ACCESS_KEY:}
    secret-key: ${STORAGE_OSS_SECRET_KEY:}
    bucket: ${STORAGE_OSS_BUCKET:}
    region: ${STORAGE_OSS_REGION:cn-hangzhou}
