# 云枢智学 · 本地开发依赖服务
#
# 用法：
#   docker compose up -d            # 启动（默认不含 Redis）
#   docker compose --profile p1 up -d  # 启动并带上 Redis（P1）
#   docker compose ps               # 查看状态
#   docker compose logs -f mysql    # 查看日志
#   docker compose down             # 停止（保留数据）
#   docker compose down -v          # 停止并删除数据卷（清库，谨慎）
#
# 说明：
# 1. 本文件只用于开发环境。生产形态仍是 Nginx + Spring Boot jar + MySQL 8.0 + 阿里云 OSS。
#    Redis 属 P1 能力，默认不启动，只有显式 --profile p1 才启动。
# 2. 表结构由后端 Flyway 在应用启动时执行 V1/V2，这里不挂载 docs/design/schema/*.sql；
#    否则会绕过 Flyway 历史，后续迁移必然冲突。
# 3. 所有口令从同目录 .env 读取，修改后执行 docker compose up -d 生效。

name: yunshu-dev

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0：字符集与排序规则按 docs/rules/database-rules.md 固定
  # ---------------------------------------------------------------------------
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.46}
    container_name: yunshu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 规则要求库内存 UTC；业务自然日（面试配额）由应用按 Asia/Shanghai 计算
      - --default-time-zone=+00:00
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - yunshu-net

  # ---------------------------------------------------------------------------
  # Redis：P0 架构未使用，仅为 P1（缓存 / 分布式限流 / 多实例）预留
  # ---------------------------------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: yunshu-redis
    # P0 不使用 Redis；仅在 --profile p1 时启动
    profiles: ["p1"]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      # 若后续承担登录锁定/限流计数，不能用会淘汰键的策略
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - yunshu-net

  # ---------------------------------------------------------------------------
  # MinIO：开发环境对象存储，经 S3StorageAdapter 接入 ObjectStorage 端口
  # （生产使用 OssStorageAdapter，两者是独立适配器，不是改 endpoint）
  # API: http://127.0.0.1:9000  Console: http://127.0.0.1:9001
  #
  # 后端跑在宿主机时，storage.s3.endpoint 与 public-endpoint 均填
  # http://127.0.0.1:9000；后端若并入本 compose 网络，endpoint 改用
  # http://minio:9000，public-endpoint 仍填 http://127.0.0.1:9000。
  # ---------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: yunshu-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    # 不设 healthcheck：部分 MinIO 镜像不含 curl/wget，避免误报 unhealthy；
    # 就绪判断由 minio-init 的重试循环负责。
    networks:
      - yunshu-net

  # 一次性初始化：等待 MinIO 可用后创建私有 Bucket，执行完即退出
  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    container_name: yunshu-minio-init
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        attempt=0
        until mc alias set local "http://minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "MinIO 未就绪，初始化失败" >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET" 2>/dev/null || true
        echo "MinIO 初始化完成：bucket=$$MINIO_BUCKET"
    networks:
      - yunshu-net

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  yunshu-net:
    driver: bridge
