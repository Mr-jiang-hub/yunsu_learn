<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 云枢智学</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div id="app-header"></div>
<main class="container page" id="app"></main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/c-shared.js"></script>
<script>
(function () {
  var user = C.init('home');
  if (!user) return;
  var app = document.getElementById('app');
  var route = C.route();
  var subject = route ? C.subject(route) : null;
  var stats = route ? C.routeStats(route.id) : { done: 0, total: 0, pct: 0 };
  var ivDone = C.interviews().filter(function (i) { return i.status === 'completed'; }).length;

  function maskPhone(p) {
    p = String(p || '');
    return p.length === 11 ? p.slice(0, 3) + '****' + p.slice(-4) : p;
  }

  app.innerHTML =
    '<div class="page-head"><div><div class="page-title">个人中心</div>' +
      '<div class="page-sub">管理你的账号信息与学习设置。</div></div></div>' +

    '<div class="profile-grid">' +
      '<div class="col gap-16">' +
        '<div class="profile-card">' +
          UI.avatarHtml(user.nickname, 'xl', user.avatar) +
          '<h3>' + UI.esc(user.nickname) + '</h3>' +
          '<div class="small muted" style="margin-top:3px">' + UI.esc(maskPhone(user.phone)) + '</div>' +
          '<div class="row center gap-8 mt-12" style="justify-content:center;flex-wrap:wrap">' +
            (subject ? '<span class="tag tag-brand">' + UI.esc(subject.name) + '</span>' : '<span class="tag">未选路线</span>') +
            '<span class="tag">' + UI.fmtDate(user.joinedAt) + ' 加入</span>' +
          '</div>' +
          '<div class="row mt-20" style="gap:8px;justify-content:center">' +
            '<button class="btn btn-sm btn-ghost" data-act="edit">编辑资料</button>' +
            '<button class="btn btn-sm btn-ghost" data-act="logout">' + UI.icon('logout', 14) + '退出</button>' +
          '</div>' +
        '</div>' +

        '<div class="card card-pad">' +
          '<div class="grid g2" style="gap:12px">' +
            '<div><div class="tiny muted">路线进度</div><div style="font-size:20px;font-weight:800">' + stats.pct + '%</div></div>' +
            '<div><div class="tiny muted">完成课程</div><div style="font-size:20px;font-weight:800">' + stats.done + '<span style="font-size:12px;color:var(--muted)"> / ' + stats.total + '</span></div></div>' +
            '<div><div class="tiny muted">练习次数</div><div style="font-size:20px;font-weight:800">' + C.practices().length + '</div></div>' +
            '<div><div class="tiny muted">完成面试</div><div style="font-size:20px;font-weight:800">' + ivDone + '</div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="col gap-16">' +
        '<div class="card card-pad">' +
          '<div class="card-title mb-8">账号信息</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>昵称</h4><p>展示在学员端顶部与面试记录中</p></div>' +
            '<div class="row gap-8"><span class="small">' + UI.esc(user.nickname) + '</span><button class="btn btn-sm btn-ghost" data-act="nick">修改</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>手机号</h4><p>用于登录与验证码登录</p></div>' +
            '<div class="row gap-8"><span class="small mono">' + UI.esc(maskPhone(user.phone)) + '</span><button class="btn btn-sm btn-ghost" data-act="phone">换绑</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>登录密码</h4><p>修改后请使用新密码登录</p></div>' +
            '<button class="btn btn-sm btn-ghost" data-act="pwd">修改密码</button>' +
          '</div>' +
        '</div>' +

        '<div class="card card-pad">' +
          '<div class="card-title mb-8">学习设置</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>主学习路线</h4><p>' +
              (subject ? '当前：' + UI.esc(subject.name) + ' · ' + stats.pct + '% 进度' : '还没有选择学习路线') + '</p></div>' +
            '<a class="btn btn-sm btn-ghost" href="routes.html">' + (subject ? '更换路线' : '去选择') + UI.icon('chevronRight', 13) + '</a>' +
          '</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>错题本</h4><p>' + C.wrongList().length + ' 道题待复习</p></div>' +
            '<a class="btn btn-sm btn-ghost" href="wrongbook.html">查看</a>' +
          '</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>面试记录</h4><p>全部历史保留，可对比进步</p></div>' +
            '<a class="btn btn-sm btn-ghost" href="records.html">查看</a>' +
          '</div>' +
        '</div>' +

        '<div class="card card-pad">' +
          '<div class="card-title mb-8">关于与演示</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>版本</h4><p>云枢智学 · 页面原型 v0.3</p></div>' +
            '<span class="tag">演示版</span>' +
          '</div>' +
          '<div class="setting-row">' +
            '<div class="info"><h4>重置演示数据</h4><p>清空本机学习进度、练习、错题与面试记录</p></div>' +
            '<button class="btn btn-sm btn-danger-ghost" data-act="reset">重置</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  function editProfile() {
    var m = UI.modal({
      title: '编辑资料',
      subtitle: '昵称与头像会展示在学员端',
      body:
        '<div class="field"><label>昵称</label><input class="input" id="pfNick" maxlength="12" value="' + UI.esc(user.nickname) + '"></div>' +
        '<div class="field"><label>头像</label>' +
          '<div class="row gap-12">' +
            '<span id="pfPrev">' + UI.avatarHtml(user.nickname, 'lg', user.avatar) + '</span>' +
            '<div class="col gap-8">' +
              '<label class="btn btn-sm btn-ghost" style="cursor:pointer">' + UI.icon('upload', 14) + '上传图片<input type="file" id="pfFile" accept="image/*" style="display:none"></label>' +
              '<button class="btn btn-sm btn-ghost" id="pfClear">使用昵称首字</button>' +
            '</div>' +
          '</div>' +
          '<div class="hint mt-8">建议正方形图片，演示数据仅保存在本地浏览器。</div>' +
        '</div>',
      actions: [
        { label: '取消', cls: 'btn-ghost' },
        { label: '保存', cls: 'btn-primary', onClick: function (ov) {
            var nick = ov.querySelector('#pfNick').value.trim();
            if (!nick) { UI.toast('昵称不能为空', 'err'); return false; }
            user.nickname = nick;
            user.avatar = ov.dataset.avatar || '';
            Store.set('user', user);
            UI.toast('资料已更新');
            setTimeout(function () { location.reload(); }, 350);
          } }
      ]
    });
    var ov = m.el;
    var file = ov.querySelector('#pfFile');
    var prev = ov.querySelector('#pfPrev');
    var nickInput = ov.querySelector('#pfNick');
    ov.dataset.avatar = user.avatar || '';

    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      if (f.size > 800 * 1024) { UI.toast('图片不要超过 800KB', 'err'); file.value = ''; return; }
      var r = new FileReader();
      r.onload = function () {
        ov.dataset.avatar = r.result;
        prev.innerHTML = UI.avatarHtml(nickInput.value || user.nickname, 'lg', r.result);
      };
      r.readAsDataURL(f);
    });
    ov.querySelector('#pfClear').addEventListener('click', function () {
      ov.dataset.avatar = '';
      prev.innerHTML = UI.avatarHtml(nickInput.value || user.nickname, 'lg', '');
    });
    nickInput.addEventListener('input', function () {
      if (!ov.dataset.avatar) prev.innerHTML = UI.avatarHtml(nickInput.value || '?', 'lg', '');
    });
  }

  function changePwd() {
    UI.modal({
      title: '修改密码',
      body:
        '<div class="field"><label>原密码</label><input class="input" type="password" id="oldPwd" placeholder="请输入原密码"></div>' +
        '<div class="field"><label>新密码</label><input class="input" type="password" id="newPwd" placeholder="至少 6 位"></div>' +
        '<div class="field"><label>确认新密码</label><input class="input" type="password" id="newPwd2" placeholder="再次输入新密码"></div>' +
        '<div class="hint">原型演示不校验原密码，新密码仅用于演示提示。</div>',
      actions: [
        { label: '取消', cls: 'btn-ghost' },
        { label: '确认修改', cls: 'btn-primary', onClick: function (ov) {
            var a = ov.querySelector('#oldPwd').value;
            var b = ov.querySelector('#newPwd').value;
            var c = ov.querySelector('#newPwd2').value;
            if (!a) { UI.toast('请输入原密码', 'err'); return false; }
            if (b.length < 6) { UI.toast('新密码至少 6 位', 'err'); return false; }
            if (b !== c) { UI.toast('两次输入的新密码不一致', 'err'); return false; }
            UI.toast('密码修改成功');
          } }
      ]
    });
  }

  function rebindPhone() {
    UI.modal({
      title: '换绑手机号',
      subtitle: '需要验证新手机号',
      body:
        '<div class="field"><label>新手机号</label><input class="input" id="npPhone" maxlength="11" inputmode="numeric" placeholder="请输入 11 位手机号"></div>' +
        '<div class="field"><label>验证码</label><div class="input-group">' +
          '<input class="input" id="npCode" maxlength="6" placeholder="演示验证码 123456">' +
          '<button class="btn btn-ghost" id="npSend" type="button">获取验证码</button>' +
        '</div></div>',
      actions: [
        { label: '取消', cls: 'btn-ghost' },
        { label: '确认换绑', cls: 'btn-primary', onClick: function (ov) {
            var p = ov.querySelector('#npPhone').value.trim();
            var code = ov.querySelector('#npCode').value.trim();
            if (!/^1\d{10}$/.test(p)) { UI.toast('请输入正确的手机号', 'err'); return false; }
            if (code !== '123456') { UI.toast('验证码不正确（演示 123456）', 'err'); return false; }
            user.phone = p;
            Store.set('user', user);
            UI.toast('手机号已换绑');
            setTimeout(function () { location.reload(); }, 400);
          } }
      ]
    });
    var send = document.getElementById('npSend');
    if (send) send.addEventListener('click', function () {
      UI.toast('验证码已发送（演示 123456）', 'info');
    });
  }

  app.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'edit' || act === 'nick') { editProfile(); return; }
    if (act === 'pwd') { changePwd(); return; }
    if (act === 'phone') { rebindPhone(); return; }
    if (act === 'logout') {
      UI.confirm('退出登录', '退出后需要重新登录才能继续学习。', function () { C.logout(); }, '退出登录', true);
      return;
    }
    if (act === 'reset') {
      UI.confirm('重置演示数据', '将清空本机的学习进度、练习记录、错题本与面试记录，并回到登录页。此操作不可恢复。', function () {
        ['user', 'progress', 'practices', 'wrong', 'interviews', 'seeded'].forEach(function (k) { Store.del(k); });
        UI.toast('已重置演示数据');
        setTimeout(function () { location.href = 'login.html'; }, 400);
      }, '确认重置', true);
    }
  });
})();
</script>
</body>
</html>
